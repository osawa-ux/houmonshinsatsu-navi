<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>在宅クリニックナビ ロゴ プレビュー</title>
<style>
  body { font-family: 'Noto Sans JP', sans-serif; margin: 0; padding: 40px; background: #fafafa; color: #222; }
  h1 { font-size: 20px; border-bottom: 2px solid #1a6e3c; padding-bottom: 8px; }
  .row { background: #fff; padding: 24px; margin: 16px 0; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row.dark { background: #1a6e3c; }
  .row.cream { background: #f0faf4; }
  .label { font-size: 12px; color: #666; margin-bottom: 12px; }
  img { max-width: 100%; height: auto; }
  .mark-row { display: flex; gap: 24px; align-items: center; }
  .mark-row img { width: 120px; }
</style>
</head>
<body>
  <h1>在宅クリニックナビ ロゴ プレビュー（DM Phase 1-α 用）</h1>

  <div class="row">
    <div class="label">① フルカラー（メイン）/ 白背景</div>
    <img src="zaitakuclinic-navi-logo.svg" alt="logo color">
  </div>

  <div class="row cream">
    <div class="label">② フルカラー / クリーム背景（#f0faf4 サイト準拠）</div>
    <img src="zaitakuclinic-navi-logo.svg" alt="logo on cream">
  </div>

  <div class="row dark">
    <div class="label" style="color:#fff;">③ DMヘッダー想定 / 緑ベタ背景（白抜き未対応・参考表示）</div>
    <img src="zaitakuclinic-navi-logo.svg" alt="logo on dark">
  </div>

  <div class="row">
    <div class="label">④ モノクロ（白黒印刷フォールバック）</div>
    <img src="zaitakuclinic-navi-logo-mono.svg" alt="logo mono">
  </div>

  <div class="row mark-row">
    <div>
      <div class="label">⑤ シンボルマークのみ（SNS アイコン / 名刺隅 用）</div>
      <img src="zaitakuclinic-navi-mark.svg" alt="mark">
    </div>
    <div style="font-size:14px; color:#666;">
      正方形 160x160 / 緑ベース<br>
      家+医療クロスの視認性最大化
    </div>
  </div>
</body>
</html>
