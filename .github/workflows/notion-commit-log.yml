name: Log commits to Notion

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
    inputs:
      backfill_count:
        description: '過去コミットをまとめて送信する件数（0=最新1件のみ）'
        required: false
        default: '0'

jobs:
  notify-notion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send commit info to Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          BACKFILL: ${{ github.event.inputs.backfill_count || '0' }}
        run: |
          python3 << 'PYSCRIPT'
          import subprocess, json, os, time, urllib.request, urllib.error

          api_key = os.environ["NOTION_API_KEY"]
          db_id = os.environ["NOTION_DATABASE_ID"]
          backfill = int(os.environ.get("BACKFILL", "0"))
          count = max(backfill, 1)

          repo = subprocess.check_output(["git", "remote", "get-url", "origin"], text=True).strip()
          repo_name = repo.rstrip("/").split("/")[-1].replace(".git", "")

          log = subprocess.check_output(
              ["git", "log", f"-n{count}", "--reverse", "--pretty=format:%h\t%aI\t%s"],
              text=True
          ).strip().split("\n")

          sent = 0
          failed = 0

          for line in log:
              if not line.strip():
                  continue
              parts = line.split("\t", 2)
              if len(parts) < 3:
                  print(f"SKIP: bad format: {line}")
                  continue
              cid, cdate, cmsg = parts

              try:
                  files = subprocess.check_output(
                      ["git", "diff", "--name-only", f"{cid}~1", cid],
                      text=True, stderr=subprocess.DEVNULL
                  ).strip().split("\n")
                  file_count = len([f for f in files if f.strip()])
              except Exception:
                  file_count = 0

              payload = json.dumps({
                  "parent": {"database_id": db_id},
                  "properties": {
                      "コミットメッセージ": {"title": [{"text": {"content": cmsg[:100]}}]},
                      "コミットID": {"rich_text": [{"text": {"content": cid}}]},
                      "日時": {"date": {"start": cdate}},
                      "リポジトリ": {"select": {"name": repo_name}},
                      "変更ファイル数": {"number": file_count}
                  }
              }, ensure_ascii=False).encode("utf-8")

              req = urllib.request.Request(
                  "https://api.notion.com/v1/pages",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Notion-Version": "2022-06-28",
                      "Content-Type": "application/json; charset=utf-8",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(req) as resp:
                      print(f"OK: {cid} - {cmsg} (HTTP {resp.status})")
                      sent += 1
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  print(f"::error::Notion API error (HTTP {e.code}): {body}")
                  failed += 1

              time.sleep(0.5)

          print(f"Complete: {sent} sent, {failed} failed")
          if failed > 0:
              raise SystemExit(1)
          PYSCRIPT
