name: Neutrality Check

on:
  push:
    paths:
      - 'blog/**'
      - 'guide/**'
  pull_request:
    paths:
      - 'blog/**'
      - 'guide/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check banned words in blog/ and guide/
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_banned_words.py
